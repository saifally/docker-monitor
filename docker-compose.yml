version: '3.8'

services:
  docker-monitor:
    build: .
    container_name: docker-monitor
    environment:
      MONITOR_FREQUENCY: 30s
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-docker-monitor}
      # Clean YAML configuration using multi-line string
      LOG_CONFIG: |
        - driver: console
          options:
            format: json
            level: info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logs:/logs  # For CSV/Excel output
      - ./config.yaml:/app/config.yaml:ro  # YAML config file
    restart: unless-stopped
    depends_on:
      - app
      - redis
    networks:
      - monitor-network

  # Alternative configuration with multiple drivers
  docker-monitor-multi:
    build: .
    container_name: docker-monitor-multi
    environment:
      MONITOR_FREQUENCY: 30s
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-docker-monitor}
      # Multiple logging drivers in clean YAML format
      LOG_CONFIG: |
        - driver: console
          options:
            format: text
            level: info
        - driver: csv
          output_path: /logs/metrics.csv
        - driver: excel
          output_path: /logs/metrics.xlsx
          options:
            sheet_name: Metrics
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logs:/logs
    restart: unless-stopped
    depends_on:
      - app
      - redis
    networks:
      - monitor-network
    profiles:
      - multi-logger

  # CloudWatch configuration (requires AWS credentials)
  docker-monitor-cloudwatch:
    build: .
    container_name: docker-monitor-cloudwatch
    environment:
      MONITOR_FREQUENCY: 30s
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-docker-monitor}
      # CloudWatch configuration in clean YAML format
      LOG_CONFIG: |
        - driver: cloudwatch
          options:
            log_group: /docker-monitor/production
            log_stream: container-monitor
            region: us-east-1
            retention_days: "30"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    depends_on:
      - app
      - redis
    networks:
      - monitor-network
    profiles:
      - cloudwatch

  # Example application services to monitor
  app:
    image: nginx:alpine
    container_name: example-app
    ports:
      - "8081:80"
    networks:
      - monitor-network

  redis:
    image: redis:alpine
    container_name: example-redis
    networks:
      - monitor-network
      
networks:
  monitor-network:
    driver: bridge